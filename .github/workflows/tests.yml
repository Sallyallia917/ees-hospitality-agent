name: MVP 1.2 checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: RAG evaluation
        run: python -m evals.run_evaluation
      - name: MVP 1.1 routing regression
        run: python -m evals.run_routing_evaluation
      - name: MVP 1.2 hybrid routing evaluation
        run: python -m evals.run_mvp_1_2_evaluation
